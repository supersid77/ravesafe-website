# Rebuilds the website every 3 days so the "Latest from testing services"
# headlines on the Heads Up page stay fresh (SOP section 9a).
# Needs a repository secret called NETLIFY_BUILD_HOOK holding the Netlify build hook URL.
# Each rebuild uses 15 Netlify credits, so keep this to every 3 days on the free plan.
name: Heads Up rebuild

on:
  schedule:
    - cron: "17 5 */3 * *"   # 05:17 UTC on every third day of the month
  workflow_dispatch: {}       # lets Sid or Claude run it by hand from the Actions tab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Netlify to rebuild
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK secret is missing. Add it in GitHub: Settings, Secrets and variables, Actions."
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$HOOK?trigger_title=Heads+Up+3-day+rebuild"
          echo "Rebuild requested."
